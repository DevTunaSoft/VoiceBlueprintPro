# Phone binaries share the desktop release tag. The reusable workflow produces
# signed Android APK/AAB and an unsigned iOS IPA for sideloading; optional App
# Store signing runs afterwards. Legacy mobile-v* tags still draft a prerelease.
# Store uploads stay in android-play-internal.yml and ios-testflight.yml.
# Secrets live in the protected mobile-release environment.

name: mobile-release

on:
  workflow_call:
    inputs:
      release_ref:
        description: Exact desktop release tag to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release tag to build (empty uses the selected ref)
        type: string
        default: ''
      android:
        description: Build Android
        type: boolean
        default: true
      release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets

      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p out
          cp assets/VoiceBlueprintPro-android-release/VoiceBlueprint.apk "out/VoiceBlueprintPro-${TAG}.apk"
          cp assets/VoiceBlueprintPro-android-release/VoiceBlueprint.aab "out/VoiceBlueprintPro-${TAG}.aab"
          (cd out && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          VoiceBlueprintPro Android app ${TAG}. Preview builds; they run models on the phone.

          | File | Use |
          |---|---|
          | \`VoiceBlueprintPro-${TAG}.apk\` | Android: install directly (allow installs from this source) |
          | \`VoiceBlueprintPro-${TAG}.aab\` | Android App Bundle for Google Play |

          Verify downloads against \`SHA256SUMS.txt\`. Details: docs/mobile.md.
          NOTES
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true || { echo "Refusing to replace a published release"; exit 1; }
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/* --repo "$REPO" --verify-tag --draft --prerelease --title "$TAG — VoiceBlueprintPro Android" --notes-file notes.md
          fi
